title: Remote System Discovery via ARP / nmap
id: 7c9d2e8b-3a4f-4f1a-8b2c-9c6e7b3f1f03
status: experimental
description: |
  Detects ARP / network-neighbor enumeration commonly used to map
  reachable hosts after landing on a compromised box.
references:
  - https://attack.mitre.org/techniques/T1018/
author: Suliman Khan
date: 2026-04-29
tags:
  - attack.discovery
  - attack.t1018
logsource:
  product: linux
  category: process_creation
detection:
  selection_remote_disc_tools:
    Image|endswith:
      - '/arp'
      - '/arping'
      - '/nmap'
      - '/masscan'
      - '/fping'
  condition: selection_remote_disc_tools
falsepositives:
  - Network monitoring scripts
  - Site-reliability tools auditing reachability
level: medium
