title: Bash Reconnaissance Commands From Container
id: 6c1d4e52-7b8f-4f2e-9b3d-9c6e7b3f1d3a
status: experimental
description: |
  Detects execution of common reconnaissance commands (whoami, id, hostname, uname, w)
  inside a container. While these are harmless individually, they often run together
  immediately after a compromise as part of an attacker's "what did I land on?" check.
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1033/
author: Suliman Khalid Noor
date: 2026-04-29
tags:
  - attack.execution
  - attack.discovery
  - attack.t1059.004
  - attack.t1033
logsource:
  product: linux
  category: process_creation
detection:
  selection_recon:
    Image|endswith:
      - '/whoami'
      - '/id'
      - '/hostname'
      - '/uname'
      - '/w'
      - '/who'
  condition: selection_recon
falsepositives:
  - Legitimate startup probes
  - Health check scripts
level: medium
