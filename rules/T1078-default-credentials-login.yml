title: Default Credentials Login Attempt to Web App
id: 4aff1b2f-5fdf-4fff-3f1f-9c6e7b3f251c
status: experimental
description: |
  Detects HTTP POST requests to common login endpoints with well-known
  default credentials in the body (admin/admin, root/root, etc.).
  Targets brute-force checks or attackers trying obvious passwords.
references:
  - https://attack.mitre.org/techniques/T1078/
author: Suliman Khan
date: 2026-04-29
tags:
  - attack.initial-access
  - attack.credential-access
  - attack.t1078
logsource:
  product: nginx
  category: webserver
detection:
  selection_login_path:
    cs-uri-stem|contains:
      - '/login'
      - '/admin'
      - '/wp-login.php'
      - '/api/auth'
      - '/rest/user/login'
  selection_post:
    cs-method: 'POST'
  selection_default_creds:
    cs-body|contains:
      - 'admin@admin'
      - 'admin:admin'
      - 'password=admin'
      - 'password=root'
      - 'password=password'
      - 'password=123456'
      - 'password=letmein'
  condition: selection_login_path and selection_post and selection_default_creds
falsepositives:
  - Application security tests
  - QA / dev environment testing
level: medium
