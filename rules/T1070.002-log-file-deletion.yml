title: Log File Deletion or Truncation
id: 17cf90fd-2faf-4fdf-0fef-9c6e7b3f22ef
status: experimental
description: |
  Detects deletion or truncation of files in /var/log/. Attackers wipe
  logs to remove evidence of their actions (auth.log, syslog, audit.log).
  Containers should never need to clear their own logs.
references:
  - https://attack.mitre.org/techniques/T1070/002/
author: Suliman Khalid Noor
date: 2026-04-29
tags:
  - attack.defense-evasion
  - attack.t1070.002
logsource:
  product: linux
  category: process_creation
detection:
  selection_destructive:
    Image|endswith:
      - '/rm'
      - '/shred'
      - '/truncate'
      - '/dd'
  selection_logs:
    CommandLine|contains:
      - '/var/log/'
      - '/var/lib/audit/'
  condition: selection_destructive and selection_logs
falsepositives:
  - logrotate operations (filtered out via parent)
  - Distribution upgrade routines
level: high
