title: Security Software Discovery
id: 7c9d2e8b-3a4f-4f1a-8b2c-9c6e7b3f1f02
status: experimental
description: |
  Detects shell processes searching for common AV/EDR/runtime-security
  binaries — falco, clamav, osquery, auditd, crowdstrike, sentinel.
  Adversaries do this to know what they need to evade or kill before
  starting noisy actions.
references:
  - https://attack.mitre.org/techniques/T1518/001/
author: Suliman Khan
date: 2026-04-29
tags:
  - attack.discovery
  - attack.t1518.001
logsource:
  product: linux
  category: process_creation
detection:
  selection_lookup_tools:
    Image|endswith:
      - '/which'
      - '/whereis'
      - '/command'
      - '/ps'
      - '/pgrep'
      - '/ls'
  selection_security_targets:
    CommandLine|contains:
      - 'falco'
      - 'clamav'
      - 'clamd'
      - 'osqueryd'
      - 'auditd'
      - 'ossec'
      - 'wazuh'
      - 'crowdstrike'
      - 'sentinel'
      - 'carbonblack'
  condition: selection_lookup_tools and selection_security_targets
falsepositives:
  - Health checks confirming a security agent is running
  - Inventory scripts
level: medium
