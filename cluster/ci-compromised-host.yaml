---
# CI-only test pod. Strips out Sandcat / Caldera (heavy, not needed for
# detection assertions) — we only need a process namespace inside the
# cluster that Falco can observe and that we can `kubectl exec` into.
apiVersion: v1
kind: Pod
metadata:
  name: compromised-host
  namespace: default
  labels:
    app: compromised-host
    purpose: ci-attack-target
spec:
  hostname: web-server-01
  restartPolicy: Never
  containers:
    - name: target
      image: ubuntu:22.04
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      securityContext:
        runAsUser: 0
