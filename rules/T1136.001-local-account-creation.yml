title: Local Account Creation in Container
id: d38fb5c9-ef5f-4f9e-cfaf-9c6e7b3f1eab
status: experimental
description: |
  Detects use of useradd, adduser, or newusers to create new local accounts.
  Containers should NEVER need new users at runtime — accounts are baked into
  the image. Runtime user creation strongly suggests an attacker establishing
  persistence with their own credentials.
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: Suliman Khalid Noor
date: 2026-04-29
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  product: linux
  category: process_creation
detection:
  selection_useradd:
    Image|endswith:
      - '/useradd'
      - '/adduser'
      - '/newusers'
  condition: selection_useradd
falsepositives:
  - Initial container bootstrap (rare)
  - System administration tools that wrap useradd
level: high
