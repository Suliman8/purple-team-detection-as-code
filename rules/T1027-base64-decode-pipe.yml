title: Base64 Decode Piped to Shell
id: 7c9d2e8b-3a4f-4f1a-8b2c-9c6e7b3f1f01
status: experimental
description: |
  Detects the classic obfuscation pattern where attackers pipe a base64-decoded
  payload directly into a shell — `base64 -d | sh`, `... | bash`, etc.
  Common in dropper scripts and reverse-shell one-liners.
references:
  - https://attack.mitre.org/techniques/T1027/
author: Suliman Khan
date: 2026-04-29
tags:
  - attack.defense-evasion
  - attack.t1027
logsource:
  product: linux
  category: process_creation
detection:
  selection_decoder:
    Image|endswith:
      - '/base64'
      - '/openssl'
    CommandLine|contains:
      - '-d'
      - '--decode'
      - 'enc -d'
  selection_shell_parent:
    ParentImage|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
      - '/ksh'
  condition: selection_decoder and selection_shell_parent
falsepositives:
  - Build pipelines that decode artifacts under bash
  - Backup scripts decoding configuration blobs
level: medium
