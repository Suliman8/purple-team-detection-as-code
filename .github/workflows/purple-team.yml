name: Purple Team — live attack & detect

# Triggers:
#   - PR / push to main: re-validate detection coverage when rules or
#     Falco config change. Skips on docs-only PRs (paths filter).
#   - Manual dispatch: handy when reproducing a failure locally.
on:
  pull_request:
    branches: [main]
    paths:
      - 'rules/**'
      - 'falco/**'
      - 'scripts/ci-attack-and-assert.sh'
      - '.github/workflows/purple-team.yml'
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'falco/**'
      - 'scripts/ci-attack-and-assert.sh'
      - '.github/workflows/purple-team.yml'
  workflow_dispatch:

concurrency:
  group: purple-team-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # required for the coverage-comment step

jobs:
  attack-and-detect:
    # WHY no kind / Helm / DaemonSet:
    # Earlier versions ran Falco as a kind-cluster DaemonSet, but GHA's
    # Azure-kernel-inside-Docker-inside-kind nesting fails for both
    # modern_ebpf (scap_init) and legacy ebpf (driver-loader compile).
    # Running Falco directly on the runner host watches the same syscalls
    # we care about — those produced by `docker run` containers — without
    # the nested-driver pain. Same rules, same matches.
    name: Falco on host + docker attack target → assert coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FALCO_LOG_FILE: /tmp/falco-events.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show host kernel info
        run: uname -r

      - name: Install Falco binary
        run: |
          curl -fsSL https://falco.org/repo/falcosecurity-packages.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/falco-archive-keyring.gpg] \
            https://download.falco.org/packages/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/falcosecurity.list
          sudo apt-get update -qq
          # FALCO_FRONTEND=noninteractive prevents the install from
          # interactively asking which driver to bake in; we configure
          # the driver via -o engine.kind=modern_ebpf at runtime instead.
          DEBIAN_FRONTEND=noninteractive \
            sudo -E apt-get install -y --no-install-recommends falco
          falco --version | head -1

      - name: Install our custom rules into /etc/falco/rules.d/
        run: |
          sudo cp falco/custom-rules/cyber-range-rules.yaml \
            /etc/falco/rules.d/cyber-range-rules.yaml
          ls -l /etc/falco/rules.d/

      - name: Start Falco in background, capturing stdout to log file
        run: |
          # -A enables all rules; -o rule_matching=all matches our
          # production setting (see falco/values.yaml — required so
          # custom rules aren't suppressed by built-ins firing first).
          # -o engine.kind=modern_ebpf forces the modern eBPF driver,
          # which works on the bare GHA host kernel (the case we lacked
          # in the kind setup).
          sudo touch "${FALCO_LOG_FILE}"
          sudo chmod 666 "${FALCO_LOG_FILE}"
          sudo nohup falco \
            -A \
            -o rule_matching=all \
            -o json_output=true \
            -o json_include_output_property=true \
            -o engine.kind=modern_ebpf \
            > "${FALCO_LOG_FILE}" 2>&1 &
          echo "Falco PID: $!"

      - name: Wait for Falco to finish initializing
        run: |
          # Falco emits "Starting health webserver" once it's fully up.
          for i in {1..30}; do
            if grep -q "Starting health webserver" "${FALCO_LOG_FILE}" 2>/dev/null; then
              echo "Falco is ready (after ${i}s)"
              echo ""
              echo "=== Falco startup log ==="
              cat "${FALCO_LOG_FILE}"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Falco didn't reach 'health webserver' in 30s. Log so far:"
          cat "${FALCO_LOG_FILE}" || true
          exit 1

      - name: Run attack burst + assert coverage
        run: ./scripts/ci-attack-and-assert.sh

      # On any failure, dump Falco logs + recent activity to the run output
      # so a reviewer doesn't need to download artifacts to debug.
      - name: Dump Falco log on failure
        if: failure()
        run: |
          echo "::group::Falco event log (last 200 lines)"
          tail -n 200 "${FALCO_LOG_FILE}" || true
          echo "::endgroup::"

      - name: Stop Falco
        if: always()
        run: sudo pkill -f '^falco' || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage-report.md
          if-no-files-found: warn

      # Posts the same Markdown report into the PR conversation. Updates
      # the existing comment in place on subsequent runs (no comment spam).
      - name: Post coverage to PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: purple-team-coverage
          path: coverage-report.md
